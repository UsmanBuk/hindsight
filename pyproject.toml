[project]
name = "hindsight"
version = "0.1.0"
description = "Local, offline meeting recorder for Linux: screen + mic + system audio, Parakeet transcription, Ollama notes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "sherpa-onnx>=2.0.1",
    "soundfile>=0.14.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
