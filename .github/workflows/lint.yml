name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff
        run: uvx ruff check .
      - name: Byte-compile
        run: python3 -m py_compile hindsight.py
      - name: ShellCheck
        run: shellcheck install.sh bin/hindsight
